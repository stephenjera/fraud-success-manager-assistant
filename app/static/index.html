<!DOCTYPE html>
<html>
  <head>
    <title>FSM Fraud Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Fraud Success Manager Assistant</h1>

      <input id="question" placeholder="Ask a fraud question..." />
      <button id="analyzeBtn" onclick="run()">Analyze</button>

      <div
        id="spinner"
        class="spinner hidden"
        aria-hidden="true"
        role="status"
        aria-live="polite"
      >
        <span class="visually-hidden">Loading</span>
      </div>

      <h3>SQL</h3>
      <div class="block" id="sql"></div>
      <h3>Results</h3>
      <div class="block" id="results"></div>
      <h3>Insight</h3>
      <div class="block" id="insight"></div>
      <h3>Rule</h3>
      <div class="block" id="rule"></div>
      <h3>Evaluation</h3>
      <div class="block" id="evaluation"></div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
