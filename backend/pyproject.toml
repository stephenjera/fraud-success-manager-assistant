[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.106.0",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.49.0",
]

[tool.ruff.lint]
select = [
    "ALL", # All rules
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "D",   # Docstring rules
    "ANN", # Type annotation rules
    "B",   # Bugbear
    "UP",  # Pyupgrade
]
ignore = [
    "D203", # One-blank-line-before-class (conflicts with D211)
    "D213", # Multi-line docstring summary on first line (Google style uses second line)
    "D212", # Multi-line docstring summary should start at the first line
    "S608"  # SQL injection risk when using f-strings
]

# Docstring style
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
]
