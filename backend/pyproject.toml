[project]
name = "backend"
version = "0.1.0"
description = "Fraud Insight & Rule Copilot — FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlglot>=25.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.49.0",
    "alembic>=1.14.0",
    "langchain-openai>=0.3",
]

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Bugbear
    "UP",  # Pyupgrade
]

ignore = [
    "ANN401", # Dynamically typed **kwargs pass-through to third-party APIs (e.g. init_chat_model)
    "COM812", # Trailing comma — conflicts with ruff format
    "CPY001", # Copyright headers are not a project convention
    "D203",   # One-blank-line-before-class (conflicts with D211)
    "D213",   # Multi-line docstring summary on first line (Google style uses second line)
    "D212",   # Multi-line docstring summary should start at the first line
    "G004",   # Logging statement uses f-string
    "T201",   # `print` found
    "TRY003", # Avoid specifying long messages outside the exception class
    "EM102",  # help: Exception must not use an f-string literal, assign to variable first Assign to variable; remove f-string literal
    "E501",   # Line too long — prompt/tool description strings read better unwrapped
]

# Docstring style
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "ruff>=0.16.1",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# Only collect the real suite; `database/` (a non-owned, unreadable dir) is not
# code we test and must not be scanned. `pythonpath` makes `app` importable.
testpaths = ["tests"]
pythonpath = ["."]
