[alembic]
script_location = alembic
# Alembic runs as ``app_rw`` (a non-superuser that owns the ``appstate`` schema)
# so it can manage tables only (ADR-0015). The URL is overridden from settings
# (appstate_dsn) in alembic/env.py; this line is a fallback placeholder. The roles,
# schemas, and GRANTs live in db-init/*.sql + the seed, not here.
sqlalchemy.url = postgresql://app_rw:app_rw@localhost:5433/fraud

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
