[project]
name = "fraud-success-manager-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.136.0", "requests>=2.33.1", "uvicorn>=0.44.0"]

[tool.ruff.lint]
select = [
    "ALL", # All rules
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "D",   # Docstring rules
    "ANN", # Type annotation rules
    "B",   # Bugbear
    "UP",  # Pyupgrade
]
ignore = [
    "D203", # One-blank-line-before-class (conflicts with D211)
    "D213", # Multi-line docstring summary on first line (Google style uses second line)
    "S608", # SQL injection risk when using f-strings
]

# Docstring style
[tool.ruff.lint.pydocstyle]
convention = "google"
